<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif}
#shell{display:flex;min-height:100vh}nav{width:60px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:4px;padding:8px 6px}
nav button{font-size:20px;background:none;border:0;padding:8px;border-radius:8px}nav button:not(:disabled){background:var(--ac2)}nav button:disabled{opacity:.35}
#c{flex:1;min-width:0;padding:12px 16px}header{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:12px;font-size:16px}header img{height:40px;max-width:120px;object-fit:contain}header button{margin-left:auto}
.card,.box{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px}.box{max-width:360px;margin:12vh auto;display:flex;flex-direction:column;gap:10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}label{display:flex;flex-direction:column;gap:3px;font-size:12px;opacity:.85}
input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;min-width:0}
button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:7px 12px;cursor:pointer}button.p{background:var(--ac);border-color:var(--ac);color:#fff}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--bd);padding:4px 6px;font-size:13px;text-align:left;vertical-align:middle}td input,td select{width:100%;min-width:90px}.tw{overflow-x:auto;margin-top:8px}.ph{display:flex;gap:8px;align-items:center}.ph img{width:56px;height:56px;object-fit:cover;border-radius:6px}.ph>div{display:flex;flex-direction:column;gap:4px}.ph input[type=file]{width:170px;font-size:11px}.md{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9}.md>div{background:var(--sf);padding:12px;border-radius:10px}.md video{max-width:100%;width:420px}.th{width:48px}.th img{width:40px;height:40px;object-fit:cover;border-radius:4px}button.d{color:#c62828}
@media print{nav,.no,button{display:none!important}body{background:#fff;color:#000}#shell{display:block}th{background:#eee;color:#000}.card{border:0}}
[hidden]{display:none!important}
</style></head><body><div id="app"></div>
<script>
/* 1) Cole aqui os dados do seu projeto (Supabase > Project Settings > API). A anon key é pública por desenho; a proteção vem do RLS. */
const SUPABASE_URL='https://jwjiqguxrutqsksdsrva.supabase.co', SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3amlxZ3V4cnV0cXNrc2RzcnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4ODE5NzEsImV4cCI6MjEwOTQ1Nzk3MX0.PFMEScTm9tObc5_BUJCkQzZHAPhOyi0OL2u67Ybrx9k';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let condo=null,galpoes=[];
const FL=[['nome','Nome'],['cnpj','CNPJ'],['cep','CEP'],['endereco','Endereço'],['numero','Número'],['bairro','Bairro'],['cidade','Cidade'],['uf','UF']];
const NAV=[['🏢','Condomínio','condo'],['🏭','Condôminos (empresas)','emp'],['✅','Aprovações','apr'],['🧑‍💼','Visitantes','vis'],['🛠️','Prestadores de serviço','srv'],['📟','Dispositivos','dev'],['👥','Usuários do sistema','usr'],['📄','Relatórios','rel'],['🔒','Privacidade (LGPD)','lgpd']];

async function boot(){try{await boot0()}catch(e){console.error(e);app.innerHTML=`<div class="box"><h3>Erro ao carregar o sistema</h3><p>${esc(e.message||e)}</p><button onclick="sb.auth.signOut().then(()=>location.reload())">Sair e tentar de novo</button></div>`}}
async function boot0(){
  if(location.hash.startsWith('#empresa-'))return publico(location.hash.slice(9));
  const{data:{session}}=await sb.auth.getSession(); if(!session)return showLogin();
  const{data:p,error:pe}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(pe)throw pe;
  if(!p){condo=null;galpoes=[];return shell(true)}            // primeiro acesso: cadastro do condomínio obrigatório
  papel=p.papel;condo=(await sb.from('condos').select('*').eq('id',p.condo_id).single()).data;
  galpoes=(await sb.from('galpoes').select('*').eq('condo_id',p.condo_id).order('identificacao')).data||[];
  shell(false);
}
function showLogin(){app.innerHTML=`<div class="box"><h2>Controle de Acesso</h2><label>E-mail<input id="em" type="email"></label><label>Senha (mín. 8 caracteres)<input id="pw" type="password"></label><button class="p" onclick="entrar()">Entrar</button><button onclick="criar()">Primeiro acesso: criar conta de administrador</button></div>`}
async function entrar(){const{error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});error?alert('Não foi possível entrar: '+error.message):boot()}
async function criar(){if($('pw').value.length<8)return alert('Use uma senha com no mínimo 8 caracteres.');const{data,error}=await sb.auth.signUp({email:$('em').value,password:$('pw').value,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return alert(error.message);data.session?boot():alert('Confirme o e-mail enviado e depois entre.')}
async function shell(first){
  let lg='';if(condo?.logo_path)lg=`<img src="${logoUrl(condo.logo_path)}" alt="">`;
  app.innerHTML=`<div id="shell"><nav>${NAV.map(([i,t,p])=>`<button title="${t}" aria-label="${t}" ${p&&!first&&(papel==='admin'||!['apr','dev','usr','lgpd'].includes(p))?`onclick="go('${p}')"`:'disabled'}>${i}</button>`).join('')}</nav><div id="c"><header>${lg}<b>${esc(condo?.nome||'Controle de Acesso')}</b><button onclick="sb.auth.signOut().then(boot)">Sair</button></header><div id="main"></div></div></div>`;
  first?condoForm(true):go('condo');
}
function condoForm(first){const c=condo||{};
  $('main').innerHTML=`${first?conviteCard():''}<h2>${first?'Cadastro do condomínio (obrigatório no primeiro acesso)':'Condomínio'}</h2><div class="card"><label>Logo (PNG, JPG ou JPEG)<input id="logo" type="file" accept="image/png,image/jpeg"></label><div class="g">${FL.map(([k,l])=>`<label>${l}<input id="f_${k}" value="${esc(c[k])}" ${k==='cep'?'onblur="cep(this)"':''} ${k==='uf'?'maxlength="2"':''}></label>`).join('')}</div><label>Informações gerais<textarea id="f_info" rows="2">${esc(c.info)}</textarea></label><div class="g"><label>Quantidade de galpões<input id="qg" type="number" min="${galpoes.length||1}" max="200" value="${galpoes.length||''}" oninput="rg()"></label></div><div id="gl" class="g"></div><button class="p" onclick="salvar(${first})">Salvar</button></div>`;
  rg();}
function rg(){const n=Math.min(+$('qg').value||0,200),old=[...document.querySelectorAll('.gi')].map(i=>i.value);
  $('gl').innerHTML=Array.from({length:n},(_,i)=>`<input class="gi" placeholder="Galpão ${i+1} (ex.: G-01)" value="${esc(old[i]??galpoes[i]?.identificacao)}" ${galpoes[i]?`data-id="${galpoes[i].id}"`:''}>`).join('')}
async function cep(el){const c=el.value.replace(/\D/g,'');if(c.length!==8)return;try{const d=await(await fetch(`https://viacep.com.br/ws/${c}/json/`)).json();if(d.erro)return alert('CEP não encontrado.');
  $('f_endereco').value=d.logradouro||'';$('f_bairro').value=d.bairro||'';$('f_cidade').value=d.localidade||'';$('f_uf').value=d.uf||'';$('f_numero').focus()}catch(e){alert('Não foi possível consultar o CEP. Preencha manualmente.')}}
async function salvar(first){
  const o={};FL.forEach(([k])=>o[k]=$('f_'+k).value.trim());o.info=$('f_info').value.trim();
  const gi=[...document.querySelectorAll('.gi')],ids=gi.map(i=>i.value.trim());
  if(FL.some(([k])=>!o[k])||!ids.length||ids.some(x=>!x)||new Set(ids).size!==ids.length)return alert('Preencha todos os campos e identifique cada galpão com um nome único.');
  let id=condo?.id;
  if(first){const{data,error}=await sb.rpc('criar_condominio',{p:o,g:ids});if(error)return alert(error.message);id=data}
  else{const{error}=await sb.from('condos').update(o).eq('id',id);if(error)return alert(error.message);
    for(const[n,i]of gi.entries())if(i.dataset.id)await sb.from('galpoes').update({identificacao:ids[n]}).eq('id',i.dataset.id);
    const novos=gi.filter(i=>!i.dataset.id).map(i=>({condo_id:id,identificacao:i.value.trim()}));if(novos.length)await sb.from('galpoes').insert(novos)}
  const f=$('logo').files[0];
  if(f){const p=`${id}/logo-${Date.now()}.${f.type==='image/png'?'png':'jpg'}`,{error}=await sb.storage.from('logos').upload(p,f);if(!error)await sb.from('condos').update({logo_path:p}).eq('id',id)}
  boot();
}
/* ===== Bloco 2: condôminos, link por empresa e aprovação ===== */
let pg='condo',edId=null,pc=0;
const CARROS=['Chevrolet','Fiat','Volkswagen','Ford','Toyota','Honda','Hyundai','Renault','Jeep','Nissan','Peugeot','Citroën','BYD','Mitsubishi','Kia','BMW','Mercedes-Benz','Audi','Volvo','Caoa Chery','GWM','Iveco','Scania','DAF','MAN','Moto Honda','Moto Yamaha','Outra'];
const EF=[['nome','Empresa'],['cnpj','CNPJ'],['telefone','Telefone'],['email','E-mail'],['responsavel','Responsável']];
const uid=()=>Math.random().toString(36).slice(2,10),logoUrl=p=>sb.storage.from('logos').getPublicUrl(p).data.publicUrl;
const go=p=>{pg=p;edId=null;({condo:()=>condoForm(false),emp:empPage,apr:aprPage,vis:()=>visPage('visitante'),srv:()=>visPage('servico'),dev:devPage,usr:usrPage,rel:relPage,lgpd:lgpdPage})[p]()};
const ph=a=>{const i='p'+(++pc);return `<div class="ph"><img id="${i}i" alt="" hidden><div><input type="file" accept="image/png,image/jpeg" onchange="pick('${i}',this)"><button type="button" onclick="cam('${i}')">📷 Câmera</button></div><input type="hidden" id="${i}" ${a}></div>`};
function setPh(i,v){$(i).value=v||'';const m=$(i+'i');m.src=v||'';m.hidden=!v}
function shrink(src,cb,max=240){const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=src}
function pick(i,el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>shrink(r.result,v=>setPh(i,v));r.readAsDataURL(f)}
async function cam(i){try{const st=await navigator.mediaDevices.getUserMedia({video:true}),m=document.createElement('div');m.className='md';m.innerHTML='<div><video autoplay playsinline></video><p><button class="p">Capturar</button> <button>Cancelar</button></p></div>';document.body.append(m);const v=m.querySelector('video');v.srcObject=st;const end=()=>{st.getTracks().forEach(t=>t.stop());m.remove()};m.querySelector('.p').onclick=()=>{const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);shrink(c.toDataURL('image/jpeg'),x=>setPh(i,x));end()};m.querySelectorAll('button')[1].onclick=end}catch(e){alert('Câmera indisponível. Use o envio de arquivo.')}}
async function up(path,dataUrl){const b=await(await fetch(dataUrl)).blob(),{error}=await sb.storage.from('fotos').upload(path,b,{contentType:'image/jpeg'});return error?null:path}
const KIND={veic:{h:['Placa','Marca','Modelo','Cor'],r:()=>`<td><input data-f="placa" placeholder="ABC1D23"></td><td><select data-f="marca"><option value="">Marca</option>${CARROS.map(x=>`<option>${x}</option>`).join('')}</select></td><td><input data-f="modelo"></td><td><input data-f="cor"></td>`},
 colab:{h:['Foto','Nome','CPF','RG','Telefone','E-mail','Veículo','Placa'],r:()=>`<td>${ph('data-f="foto"')}</td>`+['nome','cpf','rg','telefone','email','veiculo','placa'].map(k=>`<td><input data-f="${k}"></td>`).join('')}};
const rows=b=>[...$(b).querySelectorAll('tr[data-row]')].map(tr=>Object.fromEntries([...tr.querySelectorAll('[data-f]')].map(el=>[el.dataset.f,el.value.trim()])));
function gen(b,k,n,data){const K=KIND[k];n=Math.max(0,Math.min(+n||0,200));if(!data)data=rows(b);
  $(b).innerHTML=n?`<div class="tw"><table><tr>${K.h.map(x=>`<th>${x}</th>`).join('')}</tr>${Array.from({length:n},()=>`<tr data-row="${k}">${K.r()}</tr>`).join('')}</table></div>`:'';
  [...$(b).querySelectorAll('tr[data-row]')].forEach((tr,i)=>tr.querySelectorAll('[data-f]').forEach(el=>{const v=data[i]?.[el.dataset.f]||'';el.type==='hidden'?setPh(el.id,v):el.value=v}))}
const empForm=pub=>`<div class="card" id="fe">${pub?'':'<label>Logomarca da empresa (PNG/JPG)<input id="elogo" type="file" accept="image/png,image/jpeg"></label><br>'}<div class="g">${EF.map(([k,l])=>`<label>${l}<input id="e_${k}"></label>`).join('')}${pub?'<label>Galpão<input id="e_galpao" disabled></label>':`<label>Galpão<select id="e_galpao"><option value="">Selecione</option>${galpoes.map(g=>`<option value="${g.id}">${esc(g.identificacao)}</option>`).join('')}</select></label>`}</div><div class="g"><label>Quantidade de veículos<input id="qv" type="number" min="0" max="100" oninput="gen('veic','veic',this.value)"></label><label>Quantidade de colaboradores<input id="qc" type="number" min="0" max="200" oninput="gen('colab','colab',this.value)"></label></div><h4>Veículos da empresa</h4><div id="veic"></div><h4>Colaboradores</h4><div id="colab"></div></div>`;
async function empPage(){
  const{data:es}=await sb.from('empresas').select('*,galpoes(identificacao),colaboradores(status)').eq('condo_id',condo.id).order('nome');
  $('main').innerHTML=`<h2>Condôminos (empresas)</h2>${empForm(false)}<p><button class="p" onclick="saveEmp()">${edId?'Salvar alterações':'Salvar condômino'}</button> ${edId?`<button onclick="go('emp')">Cancelar</button>`:''}</p><div id="ecol"></div><h3>Empresas cadastradas</h3><div class="card tw"><table><tr><th class="th">Logo</th><th>Empresa</th><th>Galpão</th><th>Colab.</th><th>Pendentes</th><th></th></tr>${(es||[]).map(e=>`<tr><td class="th">${e.logo_path?`<img src="${logoUrl(e.logo_path)}" alt="">`:''}</td><td>${esc(e.nome)}</td><td>${esc(e.galpoes?.identificacao)}</td><td>${e.colaboradores.filter(c=>c.status==='aprovado').length}</td><td>${e.colaboradores.filter(c=>c.status==='pendente').length}</td><td><button onclick="copiar('${e.token}')">🔗 Link</button> <button onclick="editEmp('${e.id}')">Editar</button> <button class="d" onclick="delEmp('${e.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="6">Nenhuma empresa.</td></tr>'}</table></div>`;
  if(edId){const e=es.find(x=>x.id===edId);EF.forEach(([k])=>$('e_'+k).value=e[k]||'');$('e_galpao').value=e.galpao_id||'';
    const{data:vs}=await sb.from('veiculos').select('placa,marca,modelo,cor').eq('empresa_id',edId);$('qv').value=vs.length;gen('veic','veic',vs.length,vs);
    const{data:cs}=await sb.from('colaboradores').select('id,nome,cpf,status').eq('empresa_id',edId);
    $('ecol').innerHTML=`<h4>Colaboradores já cadastrados</h4><div class="card tw"><table><tr><th>Nome</th><th>CPF</th><th>Status</th><th></th></tr>${cs.map(c=>`<tr><td>${esc(c.nome)}</td><td>${esc(c.cpf)}</td><td>${c.status}</td><td><button class="d" onclick="delCol('${c.id}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="4">Nenhum.</td></tr>'}</table></div><p>Para incluir novos colaboradores, use a quantidade e as linhas acima.</p>`}
}
const editEmp=id=>{edId=id;empPage();scrollTo(0,0)};
function copiar(t){const u=location.origin+location.pathname+'#empresa-'+t;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>alert('Link copiado:\n'+u)).catch(()=>prompt('Copie o link:',u))}
async function saveEmp(){
  const o=Object.fromEntries(EF.map(([k])=>[k,$('e_'+k).value.trim()]));
  if(!o.nome||!o.cnpj||!$('e_galpao').value)return alert('Informe empresa, CNPJ e galpão.');
  const vs=rows('veic').filter(v=>v.placa),cs=rows('colab').filter(c=>c.nome);
  if(cs.some(c=>!c.cpf))return alert('Informe o CPF de cada colaborador.');
  o.galpao_id=$('e_galpao').value;let id=edId;
  if(id){const{error}=await sb.from('empresas').update(o).eq('id',id);if(error)return alert(error.message)}
  else{const{data,error}=await sb.from('empresas').insert({...o,condo_id:condo.id}).select('id').single();if(error)return alert(error.message);id=data.id}
  const lf=$('elogo').files[0];if(lf){const p=`${condo.id}/emp-${uid()}.${lf.type==='image/png'?'png':'jpg'}`,{error}=await sb.storage.from('logos').upload(p,lf);if(!error)await sb.from('empresas').update({logo_path:p}).eq('id',id)}
  await sb.from('veiculos').delete().eq('empresa_id',id);
  if(vs.length)await sb.from('veiculos').insert(vs.map(v=>({...v,condo_id:condo.id,empresa_id:id})));
  const cc=[];for(const{foto,...c}of cs)cc.push({...c,foto_path:foto?await up(`${condo.id}/colab/${uid()}.jpg`,foto):null,condo_id:condo.id,empresa_id:id,status:'aprovado',aprovado_em:new Date().toISOString()});
  if(cc.length){const{error}=await sb.from('colaboradores').insert(cc);if(error)return alert(error.message)}
  edId=null;empPage();
}
async function delCol(id){if(!confirm('Excluir este colaborador e a foto dele?'))return;const{data:c}=await sb.from('colaboradores').select('foto_path').eq('id',id).single();if(c?.foto_path)await sb.storage.from('fotos').remove([c.foto_path]);await sb.from('colaboradores').delete().eq('id',id);empPage()}
async function delEmp(id){if(!confirm('Excluir a empresa, seus veículos, colaboradores e fotos?'))return;const{data:cs}=await sb.from('colaboradores').select('foto_path').eq('empresa_id',id);const f=(cs||[]).map(c=>c.foto_path).filter(Boolean);if(f.length)await sb.storage.from('fotos').remove(f);await sb.from('empresas').delete().eq('id',id);edId=null;empPage()}
async function aprPage(){
  const{data:cs}=await sb.from('colaboradores').select('*,empresas(id,nome,dados_pendentes)').eq('condo_id',condo.id).eq('status','pendente');
  const paths=(cs||[]).map(c=>c.foto_path).filter(Boolean),urls={};
  if(paths.length){const{data}=await sb.storage.from('fotos').createSignedUrls(paths,3600);(data||[]).forEach(x=>urls[x.path]=x.signedUrl)}
  const g={};(cs||[]).forEach(c=>(g[c.empresa_id]??=[]).push(c));
  $('main').innerHTML=`<h2>Aprovação de cadastros</h2>${Object.values(g).map(l=>{const e=l[0].empresas,d=e.dados_pendentes?.empresa||{},v=e.dados_pendentes?.veiculos||[];return `<div class="card"><b>${esc(e.nome)}</b><p>Dados enviados: ${esc(d.nome)} · CNPJ ${esc(d.cnpj)} · ${esc(d.telefone)} · ${esc(d.email)} · resp. ${esc(d.responsavel)} · ${v.length} veículo(s)</p><div class="tw"><table><tr><th>Foto</th><th>Nome</th><th>CPF</th><th>RG</th><th>Telefone</th><th>E-mail</th><th>Veículo / Placa</th></tr>${l.map(c=>`<tr><td class="th">${urls[c.foto_path]?`<img src="${urls[c.foto_path]}" alt="">`:''}</td><td>${esc(c.nome)}</td><td>${esc(c.cpf)}</td><td>${esc(c.rg)}</td><td>${esc(c.telefone)}</td><td>${esc(c.email)}</td><td>${esc(c.veiculo)} ${esc(c.placa)}</td></tr>`).join('')}</table></div><p><button class="p" onclick="aprovar('${e.id}',true)">Aprovar</button> <button class="d" onclick="aprovar('${e.id}',false)">Recusar</button></p></div>`}).join('')||'<p>Nenhum cadastro pendente.</p>'}`}
async function aprovar(id,ok){const{error}=await sb.rpc('aprovar_cadastro',{p_empresa:id,p_ok:ok});if(error)return alert(error.message);aprPage()}
async function publico(token){
  app.innerHTML=`<div id="c" style="max-width:1100px;margin:auto;padding:12px 16px"><header id="ph"></header><div id="main"></div></div>`;
  const{data}=await sb.rpc('empresa_publica',{p_token:token});if(!data)return $('main').innerHTML='<p>Link inválido ou expirado.</p>';
  $('ph').innerHTML=`${data.condo.logo_path?`<img src="${logoUrl(data.condo.logo_path)}" alt="">`:''}<b>${esc(data.condo.nome)}</b>`;
  $('main').innerHTML=`<h2>Cadastro da empresa e colaboradores</h2><p class="card">Todos os campos são obrigatórios, inclusive as fotos. Após o envio, o administrador do condomínio fará a aprovação.</p>${empForm(true)}<p><label style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" id="lgpd"> Estou ciente de que os dados e fotos serão tratados pelo condomínio para controle de acesso (LGPD).</label></p><button class="p" id="envb" onclick="sendPub('${token}')">Enviar para aprovação</button>`;
  EF.forEach(([k])=>$('e_'+k).value=data.empresa[k]||'');$('e_galpao').value=data.empresa.galpao||'';
}
async function sendPub(token){
  const e=Object.fromEntries(EF.map(([k])=>[k,$('e_'+k).value.trim()])),vs=rows('veic'),cs=rows('colab');
  if(Object.values(e).some(v=>!v)||!cs.length||cs.some(c=>Object.values(c).some(v=>!v))||vs.some(v=>Object.values(v).some(x=>!x)))return alert('Todos os campos são obrigatórios, inclusive as fotos. Informe ao menos um colaborador.');
  if(!$('lgpd').checked)return alert('Confirme a ciência sobre o tratamento de dados (LGPD).');
  $('envb').disabled=true;
  for(const c of cs){c.foto_path=await up(`pub/${token}/${uid()}.jpg`,c.foto);delete c.foto;if(!c.foto_path){$('envb').disabled=false;return alert('Falha ao enviar uma foto. Tente novamente.')}}
  const{error}=await sb.rpc('enviar_cadastro',{p_token:token,p:{empresa:e,veiculos:vs,colaboradores:cs}});
  if(error){$('envb').disabled=false;return alert(error.message)}
  $('main').innerHTML='<div class="card"><h3>Cadastro enviado!</h3><p>Aguarde a aprovação do administrador do condomínio.</p></div>';
}

async function saveVis(t){

  const o={condo_id:condo.id,tipo:t,nome:g('nome'),rg:g('rg'),cpf:g('cpf'),placa:g('placa').toUpperCase(),marca:$('v_marca').value,modelo:g('modelo'),cor:g('cor'),motivo:g('motivo'),autorizado_por:$('v_aut').value,empresa_destino_id:loc==='C'?null:loc,lgpd_ciente:$('v_lgpd').checked,entrada:iso(g('entrada'))||new Date().toISOString(),saida:iso(g('saida'))};

async function gerarRel(){

  if(d)vq=vq.gte('entrada',new Date(d+'T00:00:00').toISOString());if(a)vq=vq.lte('entrada',new Date(a+'T23:59:59').toISOString());

  let r=[...(cs||[]).map(x=>({Tipo:'Funcionário',Nome:x.nome,CPF:x.cpf,RG:x.rg,'Empresa / Local':x.empresas?.nome||'',Placa:x.placa||'','Autorizado por':'','Entrada':'','Saída':''})),
    ...(vs||[]).map(x=>({Tipo:x.tipo==='servico'?'Serviço':'Visitante',Nome:x.nome,CPF:x.cpf,RG:x.rg,'Empresa / Local':x.empresas?.nome||condo.nome+' (condomínio)',Placa:x.placa||'','Autorizado por':x.autorizado_por||'','Entrada':fmt(x.entrada),'Saída':x.saida?fmt(x.saida):''}))];
  r=r.filter(x=>(!e||x['Empresa / Local']===e)&&(!q||String(x[c]||'').toLowerCase().includes(q)));
  relRows=r;const H=['Tipo','Nome','CPF','RG','Empresa / Local','Placa','Autorizado por','Entrada','Saída'];
  $('r_o').innerHTML=`<div class="card"><h3>Relatório de acessos — ${esc(condo.nome)}</h3><small>Gerado em ${fmt(new Date())} · ${r.length} registro(s)${d||a?` · período ${d||'…'} a ${a||'…'}`:''}</small><div class="tw"><table><tr>${H.map(h=>`<th>${h}</th>`).join('')}</tr>${r.map(x=>`<tr>${H.map(h=>`<td>${esc(x[h])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="9">Sem registros.</td></tr>`}</table></div></div>`;
}

  $('main').innerHTML=`<h2>Privacidade (LGPD)</h2>
  <div class="card"><b>Direitos do titular</b><p>Busque pelo CPF para baixar os dados da pessoa ou excluí-los. Cadastros de colaborador são apagados; registros de visita são anonimizados (o histórico de datas é mantido sem identificar a pessoa).</p><div class="g"><label>CPF<input id="l_cpf"></label></div><button class="p" onclick="buscaTit()">Buscar</button><div id="l_res"></div></div>
  <div class="card"><b>Retenção</b><p>Anonimiza visitas e prestadores mais antigos que o prazo abaixo (apaga também as fotos). Defina o prazo com seu jurídico ou com o condomínio.</p><div class="g"><label>Anonimizar registros com mais de (dias)<input id="l_dias" type="number" min="30" value="180"></label></div><button onclick="retencao()">Anonimizar agora</button></div>
  <h3>Últimas alterações em dados pessoais</h3><div class="card tw"><table><tr><th>Data</th><th>Tabela</th><th>Ação</th></tr>${(au||[]).map(x=>`<tr><td>${fmt(x.em)}</td><td>${esc(x.tabela)}</td><td>${esc(x.acao)}</td></tr>`).join('')||'<tr><td colspan="3">Sem registros.</td></tr>'}</table></div>`;
}
async function buscaTit(){
  const c=$('l_cpf').value.trim();if(!c)return;
  const[{data:cs},{data:vs}]=await Promise.all([sb.from('colaboradores').select('*').eq('condo_id',condo.id).eq('cpf',c),sb.from('visitas').select('*').eq('condo_id',condo.id).eq('cpf',c)]);
  titData={cpf:c,cs:cs||[],vs:vs||[]};
  $('l_res').innerHTML=`<p>${titData.cs.length} cadastro(s) de colaborador e ${titData.vs.length} registro(s) de visita.</p>${titData.cs.length+titData.vs.length?'<button onclick="baixarTit()">Baixar dados (JSON)</button> <button class="d" onclick="apagarTit()">Excluir / anonimizar</button>':''}`;
}
function baixarTit(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({colaboradores:titData.cs,visitas:titData.vs},null,2)],{type:'application/json'}));a.download='dados-titular.json';a.click()}
async function apagarTit(){
  if(!confirm('Excluir os cadastros e anonimizar as visitas deste CPF? Não há como desfazer.'))return;
  const f=[...titData.cs,...titData.vs].map(x=>x.foto_path).filter(Boolean);if(f.length)await sb.storage.from('fotos').remove(f);
  await sb.from('colaboradores').delete().eq('condo_id',condo.id).eq('cpf',titData.cpf);
  await sb.from('visitas').update({nome:'Titular removido (LGPD)',cpf:null,rg:null,placa:null,marca:null,modelo:null,cor:null,foto_path:null}).eq('condo_id',condo.id).eq('cpf',titData.cpf);
  alert('Dados excluídos/anonimizados.');lgpdPage();
}
async function retencao(){
  const n=+$('l_dias').value;if(!n||n<30)return alert('Informe ao menos 30 dias.');
  const{data}=await sb.from('visitas').select('id,foto_path').eq('condo_id',condo.id).lt('entrada',new Date(Date.now()-n*864e5).toISOString()).not('cpf','is',null);
  if(!data?.length)return alert('Nenhum registro antigo para anonimizar.');
  if(!confirm(`Anonimizar ${data.length} registro(s) com mais de ${n} dias? Não há como desfazer.`))return;
  const f=data.map(x=>x.foto_path).filter(Boolean);if(f.length)await sb.storage.from('fotos').remove(f);
  for(let i=0;i<data.length;i+=100)await sb.from('visitas').update({nome:'Titular removido (LGPD)',cpf:null,rg:null,placa:null,marca:null,modelo:null,cor:null,foto_path:null}).in('id',data.slice(i,i+100).map(x=>x.id));
  alert('Registros anonimizados.');lgpdPage();
}

addEventListener('hashchange',boot);
boot();
</script></body></html>
